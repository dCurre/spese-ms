name: Read version

on:
  push:
    branches:
      - main

jobs:
  read-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        run: |
          # Il bump della versione è gestito dall'hook pre-push locale
          # (scripts/hooks/pre-push). Il CI NON bumpa più: legge solo VERSION
          # per evitare il doppio incremento.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "Versione corrente: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
