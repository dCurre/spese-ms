services:
  - type: web
    name: spese-ms
    env: java
    plan: free
    build:
      commands:
        - chmod +x ./gradlew
        - ./gradlew build
    startCommand: java -jar build/libs/spese-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false