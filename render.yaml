services:
  - type: web
    name: your-app-name
    env: java
    plan: free
    build:
      commands:
        - chmod +x ./gradlew
        - ./gradlew build
    startCommand: java -jar build/libs/your-app.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080