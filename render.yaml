services:
  - type: web
    name: spese-ms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DATASOURCE_URL
        sync: false
      - key: DATASOURCE_PORT
        sync: false
      - key: DATASOURCE_DB_NAME
        sync: false
      - key: DATASOURCE_USERNAME
        sync: false
      - key: DATASOURCE_PASSWORD
        sync: false